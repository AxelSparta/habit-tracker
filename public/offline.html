<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Hábitos</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f6f4;
        --surface: #fcfcfb;
        --border: #e2e1dc;
        --foreground: #0b0b0b;
        --muted: #52514e;
        --accent: #2a78d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121211;
          --surface: #1a1a19;
          --border: #33332f;
          --foreground: #ffffff;
          --muted: #c3c2b7;
          --accent: #3987e5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
      }
      h1 {
        margin: 0.5rem 0 0.25rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.4;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 2rem" aria-hidden="true">📡</div>
      <h1>Sin conexión</h1>
      <p>
        Tus hábitos se guardan en tu cuenta, así que hace falta internet para
        verlos y marcarlos. Volvé a intentar cuando tengas señal.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
