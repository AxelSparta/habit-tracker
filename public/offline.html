<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Hábitos</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f3f4f7;
        --surface: #ffffff;
        --border: #dcdfe6;
        --foreground: #12151c;
        --muted: #545a69;
        --accent: #4f46e5;
        --accent-foreground: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #12151c;
          --surface: #1a1d26;
          --border: #2c303c;
          --foreground: #e6e7ee;
          --muted: #9599a8;
          --accent: #818cf8;
          --accent-foreground: #1e1b4b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }
      h1 {
        margin: 0.5rem 0 0.25rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.4;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.25rem;
        background: var(--accent);
        color: var(--accent-foreground);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 2rem" aria-hidden="true">📡</div>
      <h1>Sin conexión</h1>
      <p>
        Tus hábitos se guardan en tu cuenta, así que hace falta internet para
        verlos y marcarlos. Volvé a intentar cuando tengas señal.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
